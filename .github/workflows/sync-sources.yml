name: Refresh source snapshots

# Re-fetches every registered NCPOR/PIB document (scripts/import-sources.mjs) and, if any
# source text actually changed, commits the updated snapshot to main. That commit is the
# trigger for the normal deploy pipeline, whose `db:setup` (prisma migrate deploy +
# sources:sync) re-verifies every quote against the new text before it reaches the DB — so
# a source page changing in a way that breaks a curated quote fails the deploy loudly
# instead of silently publishing altered content.
on:
  schedule:
    - cron: "17 */30 * * *" # every 30 hours; odd minute avoids the top-of-hour GitHub Actions crunch
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch latest source snapshots
        run: npm run sources:fetch

      - name: Commit changed snapshots
        run: |
          git config user.name "polar-stories-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/sources; then
            echo "No source changes."
            exit 0
          fi
          git add data/sources
          git commit -m "chore: refresh source snapshots [automated]"
          git push
